
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="wrapper">

        <h1>Weather App</h1>

        <div class="search">
            <input type="text" id="city" placeholder="Enter city...">
            <button onclick="getWeather()">Find</button>
        </div>

        <div id="weatherInfo" hidden>
            <h2 id="cityName"></h2>

            <div class="weather-icon"></div>

            <h3 id="temperature"></h3>
            <p id="weatherResuult"></p>

            <div class="details">
                <div>
                    <span>HUMIDITY</span>
                    <p id="humidity"></p>
                </div>

                <div>
                    <span>WIND</span>
                    <p id="wind"></p>
                </div>

                <div>
                    <span>FEELS LIKE</span>
                    <p id="feelsLike"></p>
                </div>
            </div>
        </div>

        <p id="message"></p>

    </div>

</body>
</html>
